name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm install
      
    - name: Typecheck
      run: npm run typecheck --workspace=@danixsoft/hooks
      
    - name: Lint
      run: npm run lint --workspace=@danixsoft/hooks
      
    - name: Test with Coverage
      run: npm run test:coverage --workspace=@danixsoft/hooks
      
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        
    - name: Build
      run: npm run build --workspace=@danixsoft/hooks
      
    - name: Verify LLM Docs Drift
      run: git diff --exit-code apps/docs/public/llms.txt apps/docs/public/llms-full.txt
