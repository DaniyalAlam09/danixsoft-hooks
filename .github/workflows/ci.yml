name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm install
      
    - name: Typecheck
      run: npm run typecheck --workspace=@danixsoft/hooks
      
    - name: Lint
      run: npm run lint --workspace=@danixsoft/hooks
      
    - name: Test with Coverage
      run: npm run test:coverage --workspace=@danixsoft/hooks
      
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        
    - name: Build
      run: npm run build --workspace=@danixsoft/hooks
      
    # llms.txt and llms-full.txt are served by route handlers in the docs app,
    # not committed to public/, so the old git-diff drift check no longer had
    # anything to compare. This checks the source of truth behind them instead:
    # the docs hook registry must match the package's real exports.
    - name: Verify Docs Registry Matches Package Exports
      run: npm run check:registry --workspace=docs

    - name: Bundle size budget
      run: npm run size --workspace=@danixsoft/hooks

    - name: Check the published tarball
      run: npm pack --dry-run --workspace=@danixsoft/hooks

  # The library supports React >= 18; run the suite against both majors.
  react-19:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    - run: npm install
    - name: Install React 19 for the hooks workspace (not saved)
      run: npm install --no-save --workspace=@danixsoft/hooks react@19 react-dom@19
    - name: Print React version
      run: node -e "console.log('React', require('./packages/hooks/node_modules/react/package.json').version)"
    - name: Test on React 19
      run: npm run test --workspace=@danixsoft/hooks

  docs-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0 # the sitemap reads last-modified dates from git
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    - run: npm install
    - name: Lint docs
      run: npm run lint --workspace=docs
    - name: Build docs
      run: npm run build --workspace=docs
